aid: a24
name: A24
description: 'A24 is an American independent entertainment company founded in 2012 and headquartered
  in New York City that produces, finances, and distributes films and television, including award winners
  such as Everything Everywhere All at Once, Moonlight, and Hereditary. Beyond production, A24 runs a
  direct-to-consumer business spanning a merchandise shop, the AAA24 membership program, editorial
  "Notes," podcasts, and a mobile app. A24 is a portfolio company of Thrive Capital. A24 does not publish
  a public developer API; this profile is maintained in the API Evangelist network as a company record.'
